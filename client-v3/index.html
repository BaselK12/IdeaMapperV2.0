<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Branchly — collaborative mind mapping for teams. Capture ideas, connect them visually, and keep everyone in sync in one shared workspace." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Branchly — collaborative mind mapping" />
    <meta property="og:description" content="Capture ideas, connect them visually, and keep people, status, and structure in one readable workspace." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Branchly — collaborative mind mapping" />
    <meta name="twitter:description" content="Capture ideas, connect them visually, and keep people, status, and structure in one readable workspace." />
    <script>
      (() => {
        const storageKey = "branchly-theme"
        const root = document.documentElement
        const storedTheme = (() => {
          try {
            return window.localStorage.getItem(storageKey)
          } catch {
            return null
          }
        })()

        const themePreference =
          storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
            ? storedTheme
            : "system"
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light"
        const resolvedTheme =
          themePreference === "system" ? systemTheme : themePreference

        root.classList.toggle("dark", resolvedTheme === "dark")
        root.dataset.theme = resolvedTheme
        root.dataset.themePreference = themePreference
        root.style.colorScheme = resolvedTheme
      })()
    </script>
    <title>Branchly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
